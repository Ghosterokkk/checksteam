<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEAM CHECKER — Управление</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css">
<style>
body{background:#000;color:#ddd;font-family:"Roboto Mono",monospace}.owner-wrap{width:970px;max-width:calc(100% - 30px);margin:0 auto;position:relative;z-index:1}.owner-header{height:76px;border-bottom:1px solid #1b1b1b;display:flex;align-items:center;justify-content:space-between}.owner-title{font-size:18px;font-weight:700;letter-spacing:2px}.owner-title span{color:#ff1836}.owner-back{color:#777;border:1px solid #222;padding:8px 12px;border-radius:4px}.owner-card{margin:24px auto;border:1px solid #202020;background:rgba(8,8,8,.9);border-radius:8px;padding:22px}.owner-card h1{font-size:18px;margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px}.form-grid input,.form-grid select{width:100%;box-sizing:border-box;background:#050505;border:1px solid #292929;color:#ddd;border-radius:4px;padding:11px;font:inherit}.save-btn,.edit-user,.reset-user{background:#120307;border:1px solid #4a0a16;color:#ff1836;border-radius:4px;padding:10px 13px;font:inherit;cursor:pointer}.edit-user{color:#bbb;border-color:#333;background:#090909}.reset-user{color:#777;border-color:#292929;background:#070707}.status{display:inline-block;margin-left:10px;color:#777;font-size:10px}.users-table{width:100%;border-collapse:collapse;margin-top:20px}.users-table th,.users-table td{border-top:1px solid #202020;padding:11px 8px;text-align:left;font-size:11px}.users-table th{color:#666;font-weight:500}.users-table td small{display:block;color:#444;margin-top:4px}.role-color{font-weight:700}.denied{margin:50px auto;text-align:center;border:1px solid #2b0a0f;background:#090303;padding:30px;border-radius:8px;color:#ff1836}
@media(max-width:800px){.form-grid{grid-template-columns:1fr}.users-table{display:block;overflow:auto;white-space:nowrap}.owner-wrap{max-width:calc(100% - 22px)}}
</style></head><body><div class="owner-wrap"><header class="owner-header"><div class="owner-title">STEAM <span>CHECKER</span> — УПРАВЛЕНИЕ</div><a class="owner-back" href="./">На сайт</a></header>
<div id="owner-denied" class="denied" style="display:none">Доступ разрешён только владельцу сайта.</div>
<main id="owner-app" style="display:none"><section class="owner-card"><h1>Назначение отдела и привилегии</h1><div style="color:#555;font-size:10px;margin-bottom:15px">Владелец: <span id="owner-name" style="color:#aaa"></span></div><form id="user-form"><div class="form-grid"><input id="steam_id" name="steam_id" inputmode="numeric" pattern="[0-9]{17}" maxlength="17" placeholder="SteamID 64" required><select id="department"><option value="Staff">Staff</option><option value="Без отдела">Без отдела</option></select><select id="privilege"><option value="">Привилегия не назначена</option><option>Administrator</option><option>Senior Administrator</option><option>Assistant Sudo Curator</option><option>Sudo Curator</option><option>Special Admin</option></select><button class="save-btn" type="submit">Сохранить</button></div></form><span id="status" class="status"></span></section>
<section class="owner-card"><h1>Пользователи</h1><table class="users-table"><thead><tr><th>Steam</th><th>Отдел</th><th>Привилегия</th><th>Действия</th></tr></thead><tbody id="users-body"></tbody></table></section></main></div>
<script src="assets/config.js"></script><script src="assets/steam-auth.js"></script><script src="assets/owner.js"></script></body></html>
